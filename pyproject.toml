[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-dictator"
dynamic = ["version"]
description = "Headless speech-to-text dictation service for X11 and Wayland"
# readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Chris Watkins", email = "chris@watkinslabs.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pyqt6>=6.0.0",
    "speechrecognition>=3.8.0",
    "pynput>=1.6.0",
    "requests>=2.20.0",
    "numpy>=1.18.0",
    "pyaudio>=0.2.11",
    "faster-whisper>=0.10.0",
    "soundfile>=0.10.0",
    "librosa>=0.8.0",
    "sounddevice>=0.4.0",
    "platformdirs>=2.0.0",
    "dbus-next>=0.2.3",
    "tomli-w>=1.0.0",
]

keywords = ["dictation", "speech-to-text", "whisper", "wayland", "x11", "voice", "daemon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cudnn-cu12>=9.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]


[project.scripts]
dictator = "dictator_cli.__main__:main"
dictatord = "dictatord.__main__:main"

[project.urls]
Homepage = "https://github.com/chris17453/dictator"
Repository = "https://github.com/chris17453/dictator.git"
Issues = "https://github.com/chris17453/dictator/issues"

[tool.hatch.version]
path = "dictatord/version.py"

[tool.hatch.build.targets.wheel]
packages = ["dictatord", "dictator_cli"]

[tool.hatch.build.targets.wheel.shared-data]
"desktop/dictator.png" = "share/pixmaps/dictator.png"
"desktop/dictator-48.png" = "share/icons/hicolor/48x48/apps/dictator.png"
"desktop/dictator-128.png" = "share/icons/hicolor/128x128/apps/dictator.png"
"desktop/dictator-256.png" = "share/icons/hicolor/256x256/apps/dictator.png"


[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]


[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
