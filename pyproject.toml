[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-dictator"
dynamic = ["version"]
description = "Headless speech-to-text dictation service for X11 and Wayland"
# readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Chris Watkins", email = "chris@watkinslabs.com" }
]
requires-python = ">=3.8"
dependencies = [
    # service and control plane
    "dbus-next>=0.2.3",
    "platformdirs>=2.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "tomli-w>=1.0.0",
    # audio capture and rate conversion
    "sounddevice>=0.4.0",
    "numpy>=1.18.0",
    # scipy gives a polyphase resampler. There is a linear fallback, but
    # downsampling 48 kHz to 16 kHz without an anti-aliasing filter folds
    # noise into the speech band and costs recognition accuracy.
    "scipy>=1.7.0",
    # speech recognition
    "faster-whisper>=1.0.0",
    "huggingface-hub>=0.20.0",
    # X11 backends. Pure Python, so it installs anywhere; the probe reports
    # cleanly on a session where X11 is not in use.
    "python-xlib>=0.33",
]

keywords = ["dictation", "speech-to-text", "whisper", "wayland", "x11", "voice", "daemon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
# The prompt-free backends. evdev is a C extension, so it needs a compiler and
# Python headers — a hard dependency would fail the install on any machine
# without them. Every backend probes itself at startup, so its absence
# degrades to the desktop portal rather than breaking anything.
no-portal = [
    "evdev>=1.6.0",
]
cuda = [
    "nvidia-cudnn-cu12>=9.0.0",
]
all = [
    "evdev>=1.6.0",
    "nvidia-cudnn-cu12>=9.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]


[project.scripts]
dictator = "dictator_cli.__main__:main"
dictatord = "dictatord.__main__:main"

[project.urls]
Homepage = "https://github.com/chris17453/dictator"
Repository = "https://github.com/chris17453/dictator.git"
Issues = "https://github.com/chris17453/dictator/issues"

[tool.hatch.version]
path = "dictatord/version.py"

[tool.hatch.build.targets.wheel]
packages = ["dictatord", "dictator_cli"]

[tool.hatch.build.targets.wheel.shared-data]
"desktop/dictator.png" = "share/pixmaps/dictator.png"
"desktop/dictator-48.png" = "share/icons/hicolor/48x48/apps/dictator.png"
"desktop/dictator-128.png" = "share/icons/hicolor/128x128/apps/dictator.png"
"desktop/dictator-256.png" = "share/icons/hicolor/256x256/apps/dictator.png"


[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]


[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
