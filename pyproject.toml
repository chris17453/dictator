[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-dictator"
dynamic = ["version"]
description = "Real-time speech-to-text dictation app with floating Qt interface"
# readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Chris Watkins", email = "chris@watkinslabs.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pyqt6>=6.0.0",
    "speechrecognition>=3.8.0",
    "pynput>=1.6.0",
    "requests>=2.20.0",
    "numpy>=1.18.0",
    "pyaudio>=0.2.11",
    "faster-whisper>=0.10.0",
    "soundfile>=0.10.0",
    "librosa>=0.8.0",
    "sounddevice>=0.4.0",
    "platformdirs>=2.0.0",
]

keywords = ["dictation", "speech-to-text", "whisper", "pyqt6", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=0.10.0",
    "torch>=2.0.0",
    "transformers>=4.20.0",
    "sentencepiece>=0.1.95",
    "numpy>=1.18.0",
    "soundfile>=0.10.0",
]
translate = [
    "googletrans==4.0.0rc1",
]
audio = [
    "PyAudio>=0.2.11",
]
test = [
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.0.0",
    "pytest-qt>=4.0.0",
    "pytest-timeout>=2.0.0",
]

[project.scripts]
dictator = "src.__main__:main"

[project.urls]
Homepage = "https://github.com/chris17453/dictator"
Repository = "https://github.com/chris17453/dictator.git"
Issues = "https://github.com/chris17453/dictator/issues"

[tool.hatch.version]
path = "src/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/icons" = "src/icons"

[tool.hatch.build.targets.wheel.shared-data]
"desktop/dictator.desktop" = "share/applications/dictator.desktop"
"desktop/dictator.png" = "share/pixmaps/dictator.png"
"desktop/dictator-16.png" = "share/icons/hicolor/16x16/apps/dictator.png"
"desktop/dictator-32.png" = "share/icons/hicolor/32x32/apps/dictator.png"
"desktop/dictator-48.png" = "share/icons/hicolor/48x48/apps/dictator.png"
"desktop/dictator-64.png" = "share/icons/hicolor/64x64/apps/dictator.png"
"desktop/dictator-128.png" = "share/icons/hicolor/128x128/apps/dictator.png"
"desktop/dictator-256.png" = "share/icons/hicolor/256x256/apps/dictator.png"
"desktop/dictator.ico" = "share/pixmaps/dictator.ico"
"scripts/setup-permissions.sh" = "share/dictator/setup-permissions.sh"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "twine>=6.1.0",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
