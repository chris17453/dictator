[pytest]
testpaths = tests_v2
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
markers =
    slow: needs a model or real hardware (deselect with -m "not slow")
    integration: exercises the D-Bus service against a live daemon
    display: needs a real display server
filterwarnings =
    ignore::DeprecationWarning
asyncio_mode = auto
